matches:
  # Outputs the current weather for your location
  - trigger: ":weather"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "curl 'http://wttr.in/?format=3'"

  # Outputs the current date
  - trigger: ":today"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"

    # Writes my TidyTuesday hashtags
  - trigger: ":tthash"
    replace: "#rstats #ggplot2 #dataviz"
