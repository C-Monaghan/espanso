# Common typos I make
matches:
  - trigger: "continous"
    replace: "continuous"
    proagate_case: true
    word: true

  - trigger: "teh"
    replace: "the"
    propagate_case: true
    left_word: true

  - trigger: "simiarly"
    replace: "similarly"
    propagate_case: true
    word: true

  - triggers: ["similtaniously"]
    replace: "simultaneously"
    propagate_case: true
    word: true

  - triggers: ["ultimitely", "ultimetely"]
    replace: "ultimately"
    propagate_case: true
    word: true

  - triggers: ["particularity", "parituclar"]
    replace: "particular"
    propagate_case: true
    word: true

  - triggers: ["particuaraly", "particuarly"]
    replace: "particularly"
    propagate_case: true
    word: true

  - trigger: "enviroment"
    replace: "environment"
    propagate_case: true
    word: true

  - trigger: "enviromental"
    replace: "environmental"
    propagate_case: true
    word: true

  - triggers: ["calander", "calender"]
    replace: "calendar"
    propagate_case: true
    word: true
